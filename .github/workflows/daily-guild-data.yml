name: Collect guild data daily
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: guild-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch guild snapshot
        run: npm run collect
        env:
          MANARION_API_KEY: ${{ secrets.MANARION_API_KEY }}
      - name: Validate website
        run: |
          npm test
          npm run build
      - name: Commit new snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Record daily guild snapshot'
            git push
          fi
